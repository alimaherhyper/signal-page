  function sha256hex(text) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
      var bytes = new Uint8Array(buf);
      var out = "";
      for (var i = 0; i < bytes.length; i++) out += ("0" + bytes[i].toString(16)).slice(-2);
      return out;
    });
  }
  var pwStep = document.getElementById("pwStep");
  var signalStep = document.getElementById("signalStep");
  var pw = document.getElementById("pw");
  var pwBtn = document.getElementById("pwBtn");
  var pwStatus = document.getElementById("pwStatus");
  function tryPassword() {
    var entered = pw.value.replace(/\s+/g, "").toUpperCase();
    if (!entered) return;
    pwBtn.disabled = true;
    sha256hex(entered).then(function (h) {
      pwBtn.disabled = false;
      if (HASHES.indexOf(h) !== -1) {
        pwStep.classList.add("hidden");
        signalStep.classList.remove("hidden");
      } else {

        pwStatus.classList.add("err");
      }
    });
  }
  pwBtn.addEventListener("click", tryPassword);

  if (!code) {

  btn.addEventListener("click", function () {
    if (sent) return;
    sent = true;
    try { fetch(TOPIC_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: "ring" }); } catch (e) {}

    btn.disabled = true;
    btn.textContent = "وصلت الإشارة";
